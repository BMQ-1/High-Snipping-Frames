[Settings]
; Target Frame Rate for Snipping Tool Video Recording
; Supported presets: 60, 90, 120, 144, 165, 240, or 0 (Auto - matches your monitor refresh rate, e.g. 144 Hz)
TargetFPS=144

; Video Bitrate Profile:
; 0 = Balanced (16-30 Mbps) [Recommended: compact file sizes, crystal clear, instant Discord/Slack sharing]
; 1 = High Quality (22-45 Mbps) [Enhanced detail for fast-action scenes]
; 2 = Ultra Gaming (30-65 Mbps) [Maximum bitrate for esports]
BitrateMultiplier=0

; Windows Multimedia Class Scheduler Service (MMCSS) Quantum Boosting for zero frame drops at 99% GPU load
EnableMMCSS=1

; Per-Monitor Dynamic Refresh Rate Matching (1 = detect monitor under recording rect, 0 = global highest)
PerMonitorAutoMatch=1

; Floating semi-transparent recording HUD badge (WDA_EXCLUDEFROMCAPTURE: visible on screen, invisible in recorded MP4)
EnableRecordingHUD=1

; Global hotkey to launch Snipping Tool for recording (Win + Alt + R, auto-fallbacks to Ctrl + Alt + R if taken)
EnableGlobalHotkey=1

; Automatically copy freshly recorded MP4 file to Windows Clipboard (CF_HDROP) for instant paste into Discord/Slack
AutoCopyToClipboard=1

; Unlock Windows Graphics Capture (WGC) compositor throttle (IGraphicsCaptureSession5::put_MinUpdateInterval)
UnlockCompositor=1

; Unlock Media Foundation / MediaEncodingProfile video frame rate (IMediaRatio::put_Numerator)
UnlockEncoder=1

; Bypass micro-jitter frame drop throttle in VideoFrameGenerator::OnFrameArrived (ensures 100% delivered frames)
BypassThrottle=1

[StorageGuardian]
; Enable automated disk space safety and archiving (1 = Enabled, 0 = Disabled)
EnableStorageGuardian=1

; Warning threshold: show notification if Videos\Screen Recordings exceeds size in GB (0 = disabled)
MaxFolderSizeGB=15

; Auto-transfer recordings older than X days to an archive folder (0 = disabled)
TransferDays=0

; Destination folder for archived recordings (Folder X)
; Example: TransferFolder=D:\ArchivedRecordings
TransferFolder=

; Auto-delete recordings older than X days from Screen Recordings (0 = disabled)
AutoCleanDays=0
