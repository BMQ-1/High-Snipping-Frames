[Settings]
; Target Frame Rate for Snipping Tool Video Recording
; Supported presets: 60, 120, 144, or 0 (Auto - matches your monitor refresh rate, e.g. 144 Hz)
TargetFPS=144

; Video Bitrate Multiplier (0 = automatic based on TargetFPS/30)
; For 60 FPS: 2.0x, For 120 FPS: 4.0x, For 144 FPS: 4.8x
BitrateMultiplier=0

; Unlock Windows Graphics Capture (WGC) compositor throttle (IGraphicsCaptureSession5::put_MinUpdateInterval)
UnlockCompositor=1

; Unlock Media Foundation / MediaEncodingProfile video frame rate (IMediaRatio::put_Numerator)
UnlockEncoder=1

; Bypass micro-jitter frame drop throttle in VideoFrameGenerator::OnFrameArrived (ensures 100% delivered frames)
BypassThrottle=1
